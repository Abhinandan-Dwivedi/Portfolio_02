kind = "web"
previewPath = "/"
title = "Abhinandan Dwivedi Portfolio"
description = "A personal developer portfolio presenting Abhinandan Dwivedi's projects, technical skills, education, and experience using information and links from his resume."
version = "1.0.0"
id = "artifacts/abhinandan-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19070

[services.development]
run = "pnpm --filter @workspace/abhinandan-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/abhinandan-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/abhinandan-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19070"
BASE_PATH = "/"
